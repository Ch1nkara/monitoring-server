apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-server-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ch1nkara/monitoring-server.git
    targetRevision: main
    path: kubernetes/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
